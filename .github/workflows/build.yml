name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macOS-universal }
          - { os: windows-2022, name: Windows-x64 }
          - { os: ubuntu-22.04, name: Linux-x64 }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: lukka/get-cmake@latest

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            ladspa-sdk \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxi-dev

      - name: MSVC environment (so Ninja finds cl.exe)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset release -DJUCE_PATH=

      - name: Get plugin name
        id: plugin-name
        shell: bash
        run: |
          echo "name=$(cat build-release/plugin-name.txt)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cmake --build --preset release

      - name: Upload plugin
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.plugin-name.outputs.name }}-${{ github.ref_name }}-${{ matrix.name }}
          path: |
            build-release/*_artefacts/Release/VST3
            build-release/*_artefacts/Release/AU
          if-no-files-found: error
