name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
        if: runner.os == 'macOS'
      - name: Install Ninja (Windows)
        run: choco install ninja
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -B build -G Ninja -DJUCE_PATH=
      - name: Build
        run: cmake --build build --config Release
